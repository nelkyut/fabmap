<!DOCTYPE html>
<html>
<head>
<title>Interactive Property Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#f4f6f9;
}

#map{
height:100vh;
}

/* Info Panel */

#infoBox{
position:absolute;
top:20px;
right:20px;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
width:220px;
z-index:999;
transition:0.3s;
}

#infoBox h3{
margin-top:0;
color:#333;
}

#infoContent{
font-size:14px;
color:#444;
}

.empty{
color:#999;
font-style:italic;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="infoBox">
<h3>Property Info</h3>
<div id="infoContent" class="empty">
Click a house on the map
</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// image size
var imageWidth = 2000;
var imageHeight = 1200;

// create map
var map = L.map('map',{
crs: L.CRS.Simple,
minZoom:-2
});

var bounds = [[0,0],[imageHeight,imageWidth]];

L.imageOverlay('map.jpg', bounds).addTo(map);
map.fitBounds(bounds);

// house data

var houses = [

{
lat:299.54,
lng:697.03,
owner:"Ronel Rivera",
status:"Available",
lot:"House 1"
},

{
lat:700,
lng:1200,
owner:"Maria Santos",
status:"For Sale",
lot:"House 2"
}

];


// click function

map.on('click',function(e){

var tol = 20;
var found = false;

houses.forEach(function(h){

var dx = e.latlng.lng - h.lng;
var dy = e.latlng.lat - h.lat;

if(Math.abs(dx)<=tol && Math.abs(dy)<=tol){

document.getElementById("infoContent").innerHTML =
"<b>"+h.lot+"</b><br>"+
"Owner: "+h.owner+"<br>"+
"Status: "+h.status;

found = true;

}

});

if(!found){

document.getElementById("infoContent").innerHTML =
"<span class='empty'>No house here</span>";

}

});

</script>

</body>
</html>
