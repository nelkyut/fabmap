<!DOCTYPE html>
<html>
<head>
  <title>Interactive Map - Click Anywhere</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { margin: 0; }
    #map { height: 100vh; }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// Image map setup
var imageWidth = 2000;
var imageHeight = 1200;
var map = L.map('map', { crs: L.CRS.Simple, minZoom: -2 });
var bounds = [[0,0], [imageHeight, imageWidth]];
var image = L.imageOverlay('map.jpg', bounds).addTo(map);
map.fitBounds(bounds);

// Example data: coordinates + details
var houses = [
  {lat: 299.54, lng: 697.03, info: "<b>House 1</b><br>Owner: Ronel Rivera<br>Status: Available"},
  {lat: 700, lng: 1200, info: "<b>House 2</b><br>Owner: Maria Santos<br>Status: For Sale"}
];

// Click event on map
map.on('click', function(e) {
    // Find if clicked near any house (tolerance = 20 pixels)
    var tol = 20;
    var found = false;
    houses.forEach(function(h) {
        var dx = e.latlng.lng - h.lng;
        var dy = e.latlng.lat - h.lat;
        if(Math.abs(dx) <= tol && Math.abs(dy) <= tol){
            L.popup()
              .setLatLng([h.lat, h.lng])
              .setContent(h.info)
              .openOn(map);
            found = true;
        }
    });
    if(!found){
        alert("No house here!");
    }
});
</script>

</body>
</html>
