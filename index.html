<!DOCTYPE html>
<html>
<head>
<title>Subdivision Interactive Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Segoe UI, Arial;
background:#eef2f7;
}

#map{
height:100vh;
}

#infoBox{
position:absolute;
top:20px;
right:20px;
background:white;
padding:18px;
width:240px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
z-index:999;
}

#infoBox h3{
margin-top:0;
font-size:18px;
}

.status{
font-weight:bold;
padding:4px 8px;
border-radius:6px;
display:inline-block;
}

.available{background:#d4f8d4;color:#0b7a0b;}
.sale{background:#ffe4b5;color:#a15a00;}
.sold{background:#ffd6d6;color:#b30000;}

</style>

</head>

<body>

<div id="map"></div>

<div id="infoBox">
<h3>Lot Details</h3>
<div id="infoContent">Click a lot</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// map image size
var imageWidth = 2000;
var imageHeight = 1200;

var map = L.map('map',{crs:L.CRS.Simple,minZoom:-2});

var bounds = [[0,0],[imageHeight,imageWidth]];

L.imageOverlay('map.jpg',bounds).addTo(map);

map.fitBounds(bounds);


// custom icons

var greenIcon = new L.Icon({
iconUrl:'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
iconSize:[32,32]
});

var redIcon = new L.Icon({
iconUrl:'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
iconSize:[32,32]
});

var orangeIcon = new L.Icon({
iconUrl:'https://maps.google.com/mapfiles/ms/icons/orange-dot.png',
iconSize:[32,32]
});


// lot data

var houses = [

{
lat:299.54,
lng:697.03,
lot:"Lot 1",
owner:"Ronel Rivera",
status:"Available"
},

{
lat:700,
lng:1200,
lot:"Lot 2",
owner:"Maria Santos",
status:"Sold"
},

{
lat:450,
lng:900,
lot:"Lot 3",
owner:"Juan Cruz",
status:"For Sale"
}

];


// create markers

houses.forEach(function(h){

var icon;

if(h.status=="Available"){icon=greenIcon;}
if(h.status=="Sold"){icon=redIcon;}
if(h.status=="For Sale"){icon=orangeIcon;}

var marker = L.marker([h.lat,h.lng],{icon:icon}).addTo(map);

marker.on("click",function(){

var statusClass="available";

if(h.status=="Sold"){statusClass="sold";}
if(h.status=="For Sale"){statusClass="sale";}

document.getElementById("infoContent").innerHTML=

"<b>"+h.lot+"</b><br>"+
"Owner: "+h.owner+"<br><br>"+
"<span class='status "+statusClass+"'>"+h.status+"</span>";

});

});

</script>

</body>
</html>
