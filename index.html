<!DOCTYPE html>
<html>
<head>
<title>Hotspot Map – Sidebar & Popup Beige</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  overflow:hidden;
}

#map{flex:1;}

#sidebar{
  width:360px;
  background:#f5f5dc;
  border-left:3px solid #ddd;
  padding:20px;
  overflow-y:auto;
  box-shadow:-5px 0 15px rgba(0,0,0,0.1);
}

h2{margin-top:0;}

.leaflet-popup-content-wrapper{
  background:#f5f5dc;
  color:#333;
  font-weight:bold;
  border-radius:6px;
}

.leaflet-popup-tip{
  background:#f5f5dc;
}

/* pointer cursor */
.hotspot-hover{
  cursor:pointer;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
<h2>MASTER DEVELOPMENT PLAN AT FAB</h2>
<div id="info">Click a facility on the map</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// MAP SETUP
var imageWidth=2000;
var imageHeight=1200;

var map=L.map('map',{
  crs:L.CRS.Simple,
  minZoom:-2
});

var bounds=[[0,0],[imageHeight,imageWidth]];

L.imageOverlay('map.jpg',bounds).addTo(map);
map.fitBounds(bounds);

// HOTSPOTS
var hotspots=[
  {lat:742.20, lng:791.30, no:"100", name:"Two Warehouse"},
  {lat:733.97, lng:831.66, no:"101", name:"550th ABG Annex"},
  {lat:789.63, lng:943.63, no:"102", name:"MWR Complex"}
];


// CREATE HOTSPOT MARKERS
hotspots.forEach(function(h){

  var marker=L.circleMarker([h.lat,h.lng],{

    radius:12,
    color:"yellow",
    fillColor:"yellow",
    fillOpacity:0,
    weight:3

  }).addTo(map);


  // HOVER EFFECT
  marker.on("mouseover",function(){

    marker.setStyle({
      fillOpacity:0.6
    });

    map.getContainer().style.cursor="pointer";

    L.popup()
      .setLatLng([h.lat,h.lng])
      .setContent("<b>No. "+h.no+"</b><br>"+h.name)
      .openOn(map);

  });


  marker.on("mouseout",function(){

    marker.setStyle({
      fillOpacity:0
    });

    map.getContainer().style.cursor="";

    map.closePopup();

  });


  // CLICK → SIDEBAR
  marker.on("click",function(){

    document.getElementById("info").innerHTML=
      "<h3>No. "+h.no+"</h3>"+
      "<b>Name:</b> "+h.name+"<br><br>"+
      "<b>Lat:</b> "+h.lat.toFixed(2)+"<br>"+
      "<b>Lng:</b> "+h.lng.toFixed(2);

  });

});

</script>

</body>
</html>
