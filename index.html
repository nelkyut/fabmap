<!DOCTYPE html>
<html>
<head>
<title>Subdivision Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
display:flex;
height:100vh;
overflow:hidden;
}

/* MAP AREA */

#map{
flex:1;
}

/* RIGHT PANEL */

#sidebar{
width:320px;
background:white;
border-left:3px solid #ddd;
padding:20px;
box-shadow:-5px 0 15px rgba(0,0,0,0.1);
overflow-y:auto;
}

#sidebar h2{
margin-top:0;
}

.status{
padding:6px 10px;
border-radius:6px;
font-weight:bold;
display:inline-block;
}

.available{
background:#d4f8d4;
color:#0a7a0a;
}

.sold{
background:#ffd6d6;
color:#b30000;
}

.sale{
background:#ffe4b5;
color:#a15a00;
}

</style>

</head>

<body>

<div id="map"></div>

<div id="sidebar">
<h2>Lot Information</h2>

<div id="info">

Click a lot on the map to see details.

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// image size

var imageWidth = 2000;
var imageHeight = 1200;

var map = L.map('map',{
crs:L.CRS.Simple,
minZoom:-2
});

var bounds=[[0,0],[imageHeight,imageWidth]];

L.imageOverlay('map.jpg',bounds).addTo(map);

map.fitBounds(bounds);


// icons

var greenIcon = new L.Icon({
iconUrl:'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
iconSize:[32,32]
});

var redIcon = new L.Icon({
iconUrl:'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
iconSize:[32,32]
});

var orangeIcon = new L.Icon({
iconUrl:'https://maps.google.com/mapfiles/ms/icons/orange-dot.png',
iconSize:[32,32]
});


// lots data

var houses=[

{
lat:299.54,
lng:697.03,
lot:"Lot 1",
owner:"Ronel Rivera",
status:"Available"
},

{
lat:700,
lng:1200,
lot:"Lot 2",
owner:"Maria Santos",
status:"Sold"
},

{
lat:450,
lng:900,
lot:"Lot 3",
owner:"Juan Cruz",
status:"For Sale"
}

];


// create markers

houses.forEach(function(h){

var icon;

if(h.status=="Available"){icon=greenIcon;}
if(h.status=="Sold"){icon=redIcon;}
if(h.status=="For Sale"){icon=orangeIcon;}

var marker=L.marker([h.lat,h.lng],{icon:icon}).addTo(map);

marker.on("click",function(){

var statusClass="available";

if(h.status=="Sold"){statusClass="sold";}
if(h.status=="For Sale"){statusClass="sale";}

document.getElementById("info").innerHTML=

"<h3>"+h.lot+"</h3>"+
"<b>Owner:</b> "+h.owner+"<br><br>"+
"<span class='status "+statusClass+"'>"+h.status+"</span>";

});

});

</script>

</body>
</html>
