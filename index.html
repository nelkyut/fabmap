<!DOCTYPE html>
<html>
<head>
<title>Interactive Hotspot Map Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  overflow:hidden;
}
#map{flex:1;}
#sidebar{
  width:360px;
  background:white;
  border-left:3px solid #ddd;
  padding:20px;
  overflow-y:auto;
  box-shadow:-5px 0 15px rgba(0,0,0,0.1);
}
h2{margin-top:0;}
input,select,button{
  width:100%;padding:8px;margin-top:8px;margin-bottom:10px;border-radius:6px;border:1px solid #ccc;
}
button{
  background:#007bff;color:white;border:none;cursor:pointer;
}
button:hover{background:#0056b3;}
.status{padding:6px 10px;border-radius:6px;font-weight:bold;display:inline-block;}
.available{background:#d4f8d4;color:#0a7a0a;}
.sale{background:#ffe4b5;color:#a15a00;}
.sold{background:#ffd6d6;color:#b30000;}
</style>
</head>
<body>

<div id="map"></div>

<div id="sidebar">
<h2>Lot Info</h2>
<div id="info">Hover over or click a lot area</div>
<hr>
<h3>Add / Edit Hotspot</h3>
<input id="lot" placeholder="Lot Number">
<input id="owner" placeholder="Owner Name">
<select id="status">
  <option>Available</option>
  <option>For Sale</option>
  <option>Sold</option>
</select>
<button onclick="saveHotspot()">Save Hotspot</button>
<input id="search" placeholder="Search Lot Number" oninput="searchHotspot()">
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// map setup
var imageWidth=2000,imageHeight=1200;
var map=L.map('map',{crs:L.CRS.Simple,minZoom:-2});
var bounds=[[0,0],[imageHeight,imageWidth]];
L.imageOverlay('map.jpg',bounds).addTo(map);
map.fitBounds(bounds);

// storage
var hotspots=[];
var currentLat=null;
var currentLng=null;

// load saved hotspots
if(localStorage.getItem("hotspots")){
  hotspots=JSON.parse(localStorage.getItem("hotspots"));
}

// detect hover
map.on('mousemove', function(e){
  var tol=20; 
  var found=false;
  hotspots.forEach(function(h){
    var dx=e.latlng.lng - h.lng;
    var dy=e.latlng.lat - h.lat;
    if(Math.abs(dx)<=tol && Math.abs(dy)<=tol){
      showInfo(h);
      found=true;
    }
  });
  if(!found){
    document.getElementById("info").innerHTML="Hover over or click a lot area";
  }
});

// click to select location for adding new hotspot
map.on('click', function(e){
  currentLat=e.latlng.lat;
  currentLng=e.latlng.lng;
  document.getElementById("info").innerHTML=
    "Location selected<br>Lat: "+currentLat.toFixed(2)+"<br>Lng: "+currentLng.toFixed(2);
});

// show info in sidebar
function showInfo(h){
  var statusClass="available";
  if(h.status=="Sold") statusClass="sold";
  if(h.status=="For Sale") statusClass="sale";
  document.getElementById("info").innerHTML=
    "<h3>"+h.lot+"</h3>"+
    "<b>Owner:</b> "+h.owner+"<br><br>"+
    "<span class='status "+statusClass+"'>"+h.status+"</span>"+
    "<br><br><button onclick='editHotspot(\""+h.lot+"\")'>Edit</button>"+
    "<button onclick='deleteHotspot(\""+h.lot+"\")'>Delete</button>";
}

// save hotspot
function saveHotspot(){
  var lot=document.getElementById("lot").value.trim();
  var owner=document.getElementById("owner").value.trim();
  var status=document.getElementById("status").value;

  if(!lot){alert("Enter Lot Number"); return;}
  if(currentLat==null){alert("Click location on map first"); return;}

  var existing=hotspots.find(h=>h.lot===lot);
  if(existing){
    existing.owner=owner;
    existing.status=status;
  } else {
    hotspots.push({lat:currentLat,lng:currentLng,lot:lot,owner:owner,status:status});
  }

  localStorage.setItem("hotspots",JSON.stringify(hotspots));
  clearForm();
  alert("Hotspot saved!");
}

// edit hotspot
function editHotspot(lotName){
  var h=hotspots.find(h=>h.lot===lotName);
  if(h){
    document.getElementById("lot").value=h.lot;
    document.getElementById("owner").value=h.owner;
    document.getElementById("status").value=h.status;
    currentLat=h.lat;
    currentLng=h.lng;
  }
}

// delete hotspot
function deleteHotspot(lotName){
  var index=hotspots.findIndex(h=>h.lot===lotName);
  if(index>-1){
    hotspots.splice(index,1);
    localStorage.setItem("hotspots",JSON.stringify(hotspots));
    document.getElementById("info").innerHTML="Hotspot deleted.";
  }
}

// clear form
function clearForm(){
  document.getElementById("lot").value="";
  document.getElementById("owner").value="";
  currentLat=null;
  currentLng=null;
}

// search hotspot
function searchHotspot(){
  var val=document.getElementById("search").value.toLowerCase();
  var found=hotspots.find(h=>h.lot.toLowerCase().includes(val));
  if(found) showInfo(found);
}

</script>
</body>
</html>
