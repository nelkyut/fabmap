<!DOCTYPE html>
<html>
<head>
<title>Hotspot Map – Sidebar & Popup Beige</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  overflow:hidden;
}

#map{flex:1;}

#sidebar{
  width:360px;
  background:#f5f5dc;
  border-left:3px solid #ddd;
  padding:20px;
  overflow-y:auto;
  box-shadow:-5px 0 15px rgba(0,0,0,0.1);
}

h2{margin-top:0;}

.leaflet-popup-content-wrapper{
  background:#f5f5dc;
  color:#333;
  font-weight:bold;
  border-radius:6px;
}

.leaflet-popup-tip{
  background:#f5f5dc;
}

/* YELLOW HAND CURSOR */
.yellow-cursor{
cursor:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'>\
<path fill='yellow' stroke='black' stroke-width='1' d='M9 11V5a1 1 0 0 1 2 0v6h1V4a1 1 0 0 1 2 0v7h1V6a1 1 0 0 1 2 0v8h1V9a1 1 0 0 1 2 0v9a4 4 0 0 1-4 4h-5a4 4 0 0 1-3.7-2.5L6 14a1 1 0 0 1 1.8-.9L9 16v-5z'/>\
</svg>") 16 0, pointer;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
<h2>MASTER DEVELOPMENT PLAN AT FAB</h2>
<div id="info">Click anywhere on the map</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// MAP SETUP
var imageWidth=2000;
var imageHeight=1200;

var map=L.map('map',{
  crs:L.CRS.Simple,
  minZoom:-2
});

var bounds=[[0,0],[imageHeight,imageWidth]];

L.imageOverlay('map.jpg',bounds).addTo(map);
map.fitBounds(bounds);


// HOTSPOTS
var hotspots=[
  {lat:742.20, lng:791.30, no:"100", name:"Two Warehouse"},
  {lat:733.97, lng:831.66, no:"101", name:"550th ABG Annex"},
  {lat:789.63, lng:943.63, no:"102", name:"MWR Complex"}
];


// CLICK TOLERANCE
var tol=15;


// HOVER → POPUP + YELLOW CURSOR
map.on('mousemove',function(e){

  var found=false;

  hotspots.forEach(function(h){

    var dx=e.latlng.lng-h.lng;
    var dy=e.latlng.lat-h.lat;

    if(Math.abs(dx)<=tol && Math.abs(dy)<=tol){

      L.popup()
        .setLatLng([h.lat,h.lng])
        .setContent("<b>No. "+h.no+"</b><br>"+h.name)
        .openOn(map);

      map.getContainer().classList.add("yellow-cursor");

      found=true;

    }

  });

  if(!found){
    map.closePopup();
    map.getContainer().classList.remove("yellow-cursor");
  }

});


// CLICK → SIDEBAR
map.on('click',function(e){

  var lat=e.latlng.lat;
  var lng=e.latlng.lng;

  var clickedHotspot=null;

  hotspots.forEach(function(h){

    var dx=lng-h.lng;
    var dy=lat-h.lat;

    if(Math.abs(dx)<=tol && Math.abs(dy)<=tol){
      clickedHotspot=h;
    }

  });

  if(clickedHotspot){

    document.getElementById("info").innerHTML=
      "<h3>No. "+clickedHotspot.no+"</h3>"+
      "<b>Name:</b> "+clickedHotspot.name+"<br><br>"+
      "<b>Lat:</b> "+lat.toFixed(2)+"<br>"+
      "<b>Lng:</b> "+lng.toFixed(2);

  }else{

    document.getElementById("info").innerHTML=
      "<h3>Map Coordinates</h3>"+
      "<b>Lat:</b> "+lat.toFixed(2)+"<br>"+
      "<b>Lng:</b> "+lng.toFixed(2);

  }

});

</script>

</body>
</html>
