<!DOCTYPE html>
<html>
<head>
<title>Hotspot Map – Sidebar & Popup Beige</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  overflow:hidden;
}

#map{flex:1;}

#sidebar{
  width:360px;
  background:#f5f5dc;
  border-left:3px solid #ddd;
  padding:20px;
  overflow-y:auto;
  box-shadow:-5px 0 15px rgba(0,0,0,0.1);
}

h2{margin-top:0;}

.leaflet-popup-content-wrapper{
  background:#f5f5dc;
  color:#333;
  font-weight:bold;
  border-radius:6px;
}

.leaflet-popup-tip{
  background:#f5f5dc;
}

/* YELLOW POINTING HAND CURSOR */
.yellow-cursor{
cursor:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'>\
<path fill='yellow' stroke='black' stroke-width='1' d='M9 2a1 1 0 0 1 2 0v10h1V5a1 1 0 0 1 2 0v7h1V7a1 1 0 0 1 2 0v7h1V9a1 1 0 0 1 2 0v8a4 4 0 0 1-4 4h-5a4 4 0 0 1-3.7-2.5L6 14a1 1 0 0 1 1.8-.9L9 16V2z'/>\
</svg>") 6 2, pointer;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
<h2>MASTER DEVELOPMENT PLAN AT FAB</h2>
<div id="info">Click anywhere on the map</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// MAP SETUP
var imageWidth=2000;
var imageHeight=1200;

var map=L.map('map',{
  crs:L.CRS.Simple,
  minZoom:-2
});

var bounds=[[0,0],[imageHeight,imageWidth]];

L.imageOverlay('map.jpg',bounds).addTo(map);
map.fitBounds(bounds);


// HOTSPOTS (Updated list)
var hotspots=[
  {no:"100", name:"Two Warehouse", lat:742.20, lng:791.30},
  {no:"101", name:"550th ABG Annex", lat:733.97, lng:831.66},
  {no:"102", name:"MWR Complex", lat:789.63, lng:943.63},
  {no:"1", name:"MRF", lat:453.88, lng:537.38},
  {no:"2", name:"Firing Range (Long & Short Arms)", lat:452.14, lng:559.76},
  {no:"3", name:"300th AISG / Intelligence Compound", lat:435.26, lng:606.65},
  {no:"4", name:"Petron", lat:439.13, lng:642.07},
  {no:"5", name:"PAFTSS Compound", lat:430.82, lng:708.26},
  {no:"6", name:"Warehouse", lat:401.91, lng:642.35},
  {no:"7", name:"550th ABG", lat:376.28, lng:696.32},
{no:"8", name:"Maintenance Shop", lat:390.35, lng:600.35},
{no:"9", name:"8 Bay Garage", lat:373.52, lng:608.47},
{no:"10", name:"Repair Bay", lat:385.41, lng:610.91},
{no:"11", name:"555 MVS Office", lat:369.28, lng:634.91},
{no:"12", name:"TOQ 2", lat:367.63, lng:592.10},
{no:"13", name:"TOQ 3", lat:355.35, lng:612.97},
{no:"14", name:"TOQ 5", lat:358.69, lng:585.19},
{no:"15", name:"TOQ 4", lat:349.47, lng:578.03},
{no:"16", name:"SOQ 1", lat:340.63, lng:567.38},
{no:"17", name:"TOQ", lat:334.57, lng:603.38},
{no:"18", name:"AETC Band Hall Building", lat:367.20, lng:654.75},
{no:"19", name:"Heavy Equipment Garage", lat:361.00, lng:664.66},
{no:"20", name:"Power House", lat:345.41, lng:693.57},
{no:"21", name:"Central Messing Facility (Kitchen Area)", lat:353.03, lng:644.19},
{no:"22", name:"Central Messing Facility (Kitchen Area)", lat:346.50, lng:656.44},
{no:"23", name:"Alumni Hall and Museum", lat:337.19, lng:677.82},
{no:"24", name:"Swimming Pool", lat:332.91, lng:631.06},
{no:"25", name:"Outdoor Tennis Court", lat:316.66, lng:618.00},
{no:"26", name:"PAR 3 Hotel", lat:327.72, lng:644.75},
{no:"27", name:"Aircraft Park", lat:312.10, lng:655.07},
{no:"28", name:"10 - Door Apartment", lat:400.03, lng:539.47},
{no:"29", name:"TOQ 6", lat:396.16, lng:574.94},
{no:"30", name:"AFOS Students Barracks", lat:388.72, lng:561.16}
  
];

// CLICK TOLERANCE → mas precise
var tol=5;


// HOVER → POPUP + YELLOW CURSOR
map.on('mousemove',function(e){

  var found=false;

  hotspots.forEach(function(h){

    var dx=e.latlng.lng-h.lng;
    var dy=e.latlng.lat-h.lat;

    if(Math.abs(dx)<=tol && Math.abs(dy)<=tol){

      L.popup()
        .setLatLng([h.lat,h.lng])
        .setContent("<b>No. "+h.no+"</b><br>"+h.name)
        .openOn(map);

      map.getContainer().classList.add("yellow-cursor");

      found=true;

    }

  });

  if(!found){
    map.closePopup();
    map.getContainer().classList.remove("yellow-cursor");
  }

});


// CLICK → SIDEBAR
map.on('click',function(e){

  var lat=e.latlng.lat;
  var lng=e.latlng.lng;

  var clickedHotspot=null;

  hotspots.forEach(function(h){

    var dx=lng-h.lng;
    var dy=lat-h.lat;

    if(Math.abs(dx)<=tol && Math.abs(dy)<=tol){
      clickedHotspot=h;
    }

  });

  if(clickedHotspot){

    document.getElementById("info").innerHTML=
      "<h3>No. "+clickedHotspot.no+"</h3>"+
      "<b>Name:</b> "+clickedHotspot.name+"<br><br>"+
      "<b>Lat:</b> "+lat.toFixed(2)+"<br>"+
      "<b>Lng:</b> "+lng.toFixed(2);

  }else{

    document.getElementById("info").innerHTML=
      "<h3>Map Coordinates</h3>"+
      "<b>Lat:</b> "+lat.toFixed(2)+"<br>"+
      "<b>Lng:</b> "+lng.toFixed(2);

  }

});

</script>

</body>
</html>
